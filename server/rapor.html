<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vals Kullanım Raporu</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1f9d74; --s4: #8a5cd6; --accent: #2a78d6; --good: #006300; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #2bb58a; --s4: #9d74e6; --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #2bb58a; --s4: #9d74e6; --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; }
.muted { color: var(--muted); }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover, .seg button:hover { background: var(--wash); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card > .sub:first-of-type { margin-bottom: 12px; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { font-size: 26px; font-weight: 600; margin: 2px 0; }
.tile .note { font-size: 12px; color: var(--muted); }
.delta { font-size: 12px; color: var(--ink-2); }
.delta .up { color: var(--good); } .delta .dn { color: var(--bad); }
section { margin-top: 12px; }
.insights { margin: 0; padding-left: 18px; }
.insights li { margin: 4px 0; }
/* sütun grafiği */
.cc { display: grid; grid-template-columns: 34px 1fr; }
.cc-y { position: relative; }
.cc-y span { position: absolute; right: 6px; transform: translateY(50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cc-plot { position: relative; border-bottom: 1px solid var(--axis); }
.cc-plot .gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
.cc-cols { position: absolute; inset: 0; display: flex; align-items: stretch; }
.cc-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; min-width: 0; }
.cc-col:hover, .cc-col.on { background: var(--wash); }
.cc-col i { display: block; width: min(24px, 72%); }
.cc-col i + i { margin-top: 2px; }
.cc-col i:first-child { border-radius: 4px 4px 0 0; }
.cc-x { grid-column: 2; display: flex; height: 18px; }
.cc-x span { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: visible; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: -4px 0 10px; flex-wrap: wrap; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
/* yatay çubuk */
.hb { display: grid; grid-template-columns: minmax(80px, max-content) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.hb .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; color: var(--ink); }
.hb .t { height: 12px; }
.hb .t i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .v { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.hb .row { display: contents; }
.hb .row:hover > * { background: var(--wash); }
/* tablolar */
.tw { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.guest td:first-child { color: var(--ink-2); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; max-width: 260px; }
#tip b { font-weight: 600; }
#tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
.keybox { max-width: 420px; margin: 15vh auto 0; }
.keybox input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--ink); margin: 10px 0; }
.foot { margin-top: 20px; font-size: 12px; color: var(--muted); }
.foot li { margin: 2px 0; }
.foot a, .links a { color: inherit; }
.links { font-size: 12px; color: var(--ink-2); margin: 6px 0 0; }
@media (max-width: 520px) { .tile .val { font-size: 22px; } h1 { font-size: 19px; } }
/* PDF / yazdırma: her zaman açık tema, kontroller gizli, kartlar bölünmesin */
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    color-scheme: light;
    --page: #ffffff; --surface: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.14); --wash: transparent;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1f9d74; --s4: #8a5cd6; --accent: #2a78d6; --good: #006300; --bad: #d03b3b;
  }
  @page { size: A4; margin: 12mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 12px; }
  .wrap { max-width: none; padding: 0; }
  .controls, #tip, #hepsi, .seg, summary { display: none !important; }
  .card { break-inside: avoid; page-break-inside: avoid; box-shadow: none; }
  .card.wide { break-inside: auto; page-break-inside: auto; }
  tr { break-inside: avoid; }
  .tw { overflow: visible; }
  th, td { padding: 4px 6px; }
  section { margin-top: 10px; }
  .g2 { align-items: start; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Yükleniyor…</p></div>
<div id="tip" role="tooltip"></div>
<script>
'use strict';
const TZ = 'Europe/Istanbul';
const OYUN = 'https://ysf-creator1.github.io/vals-oyunu/', SUNUCU = 'https://vals.130-61-214-155.sslip.io';
const fDay = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fHour = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hour12: false });
const fDT = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fDayShort = new Intl.DateTimeFormat('tr-TR', { timeZone: 'UTC', day: 'numeric', month: 'short' });
const fDayLong = new Intl.DateTimeFormat('tr-TR', { timeZone: 'UTC', day: 'numeric', month: 'long', weekday: 'short' });
const HG = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const DILIM = [['Sabah', '06–12', h => h >= 6 && h < 12], ['Öğle', '12–17', h => h >= 12 && h < 17], ['Akşam', '17–22', h => h >= 17 && h < 22], ['Gece', '22–02', h => h >= 22 || h < 2], ['Geç gece', '02–06', h => h >= 2 && h < 6]];
const ACT = new Set(['acilis', 'basla', 'bitti', 'yardim', 'birakti']);
const BANTLAR = ['K1', 'K2', 'K3', 'K4', 'O1', 'O2', 'O3', 'O4', 'Z1', 'Z2', 'Z3', 'Z4'];
const HEDEF = { K1: 20, K2: 30, K3: 40, K4: 50, O1: 60, O2: 75, O3: 90, O4: 110, Z1: 120, Z2: 150, Z3: 180, Z4: 210 };
const KADEME = { easy: 'Kolay', medium: 'Orta', hard: 'Zor', extra: 'Ekstra zor' };
const BANT_AD = { K1: 'Kolay 1', K2: 'Kolay 2', K3: 'Kolay 3', K4: 'Kolay 4', O1: 'Orta 1', O2: 'Orta 2', O3: 'Zor 1', O4: 'Zor 2', Z1: 'Ekstra zor 1', Z2: 'Ekstra zor 2', Z3: 'Ekstra zor 3', Z4: 'Ekstra zor 4', T: 'Öğretici' };
const MOD = [['campaign', 'Seviye', 'var(--s1)'], ['daily', 'Günlük bulmaca', 'var(--s2)'], ['endless', 'Sonsuz', 'var(--s3)'], ['tutorial', 'Öğretici', 'var(--s4)']];
const MOD_AD = Object.fromEntries(MOD.map(m => [m[0], m[1]]));
const EKRAN_AD = { home: 'Ana ekran', levels: 'Seviyeler', endless: 'Sonsuz', stats: 'İstatistik', settings: 'Ayarlar', howto: 'Nasıl oynanır' };
const AYAR_AD = { sound: 'Ses', vibration: 'Titreşim', showTimer: 'Süreyi göster', helper: 'Yardımcı vurgu', fontSize: 'Yazı boyutu', highContrast: 'Yüksek karşıtlık', reducedMotion: 'Azaltılmış hareket', theme: 'Tema', lang: 'Dil' };
const DEGER_AD = { true: 'açık', false: 'kapalı', auto: 'otomatik', on: 'açık', off: 'kapalı', normal: 'normal', large: 'büyük', tr: 'Türkçe', en: 'İngilizce', classic: 'Klasik', lily: 'Nilüfer', stars: 'Takımyıldız', islands: 'Adalar' };
const YARDIM_AD = { next: 'Sıradaki taşı gösterdi', start: 'Başlangıç taşını gösterdi', wrong: 'Yanlış hamleyi gösterdi', solved: 'Zaten çözülmüş' };
const SITE_AD = { pages: 'GitHub Pages', oracle: 'Oracle sunucusu' };
const kademeOf = b => b === 'T' ? 'Öğretici' : b[0] === 'K' ? 'Kolay' : b[0] === 'Z' ? 'Ekstra zor' : (b === 'O1' || b === 'O2') ? 'Orta' : 'Zor';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Math.round(n).toLocaleString('tr-TR');
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
const sure = s => s >= 3600 ? (s / 3600).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' sa' : s >= 60 ? Math.round(s / 60) + ' dk' : s > 0 ? Math.round(s) + ' sn' : '–';
const med = a => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
const dayMs = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const dayAdd = (s, n) => new Date(dayMs(s) + n * 864e5).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((dayMs(b) - dayMs(a)) / 864e5);
const short = s => fDayShort.format(dayMs(s));
const dilimOf = h => DILIM.find(b => b[2](h));
const count = (A, f) => { const m = new Map(); for (const e of A) { const k = f(e); if (k != null) m.set(k, (m.get(k) || 0) + 1); } return m; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };

let RAW = null, M = null;
const state = { donem: store.get('vals.donem') || '30', testGizle: store.get('vals.test') !== '0', metrik: 'etkinlik', hepsi: false };

// ---------- anahtar ----------
function getKey() {
  const m = /(?:^|[#&])k=([^&]+)/.exec(location.hash);
  if (m) { store.set('vals.anahtar', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
  return store.get('vals.anahtar') || window.__key || '';
}
function askKey(msg) {
  document.getElementById('app').innerHTML = `<div class="card keybox"><h1>Vals · Kullanım raporu</h1>
    <p class="sub">${esc(msg || 'Raporu görmek için anahtarı gir.')}</p>
    <form id="kf"><input id="ki" type="password" autocomplete="off" placeholder="Rapor anahtarı" aria-label="Rapor anahtarı"><button class="btn" type="submit">Aç</button></form></div>`;
  document.getElementById('kf').onsubmit = ev => { ev.preventDefault(); const k = document.getElementById('ki').value.trim(); if (!k) return; window.__key = k; store.set('vals.anahtar', k); load(); };
}
async function load() {
  const key = getKey();
  if (!key) return askKey();
  try {
    const r = await fetch(location.pathname.replace(/\/?$/, '/') + 'veri', { headers: { 'X-Anahtar': key }, cache: 'no-store' });
    if (r.status === 401) { store.del('vals.anahtar'); window.__key = ''; return askKey('Anahtar yanlış, tekrar dene.'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    RAW = await r.json();
    prepare();
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="card"><h2>Veri alınamadı</h2><p class="sub">${esc(e.message)}</p><button class="btn" onclick="load()">Tekrar dene</button></div>`;
  }
}

// ---------- hazırlık (tüm zamanlar) ----------
function prepare() {
  const E = RAW.olaylar;
  for (const e of E) {
    const t = new Date(e.z); e.gun = fDay.format(t); e.saat = +fHour.format(t) % 24;
    e.hg = (new Date(dayMs(e.gun)).getUTCDay() + 6) % 7; e.k = e.cihaz || null;
  }
  E.sort((a, b) => a.z < b.z ? -1 : 1);
  const first = new Map(), sites = new Map();
  for (const e of E) {
    if (e.k && ACT.has(e.tur) && !first.has(e.k)) first.set(e.k, e.gun);
    if (e.tur === 'acilis' && e.k) { if (!sites.has(e.k)) sites.set(e.k, new Set()); sites.get(e.k).add(e.site || '?'); }
  }
  // test: yalnızca GitHub Pages / Oracle dışındaki adreslerden açan cihazlar (önizleme, yerel kopya)
  const test = new Set();
  for (const [k, s] of sites) if (![...s].some(x => x === 'pages' || x === 'oracle')) test.add(k);
  M = { E, test, first, firstDay: E.length ? E[0].gun : fDay.format(new Date()) };
}
function range(d) {
  const today = fDay.format(new Date());
  if (d === 'bugun') return [today, today, 'Bugün'];
  if (d === 'tumu') return [M.firstDay, today, 'Tüm zamanlar'];
  const n = Math.max(1, +d || 30), a = dayAdd(today, -(n - 1)); return [a < M.firstDay ? M.firstDay : a, today, `Son ${n} gün`];
}
const pick = (a, b) => M.E.filter(e => e.gun >= a && e.gun <= b && !(state.testGizle && e.k && M.test.has(e.k)));

function stats(E) {
  const T = t => E.filter(e => e.tur === t);
  const dev = new Map();
  for (const e of E) {
    if (!e.k || !ACT.has(e.tur)) continue;
    let d = dev.get(e.k); if (!d) dev.set(e.k, d = { days: new Set(), mob: new Set() });
    d.days.add(e.gun); if ('mobil' in e) d.mob.add(!!e.mobil);
  }
  const bit = T('bitti');
  return { E, T, dev, ac: T('acilis'), bas: T('basla'), bit, bir: T('birakti'), yar: T('yardim'), otur: T('oturum'), oyunSn: T('oturum').reduce((a, e) => a + (e.sn || 0), 0), cozum: bit.filter(e => e.mod !== 'tutorial') };
}

// cihaz başına özet
function players(S) {
  const P = new Map();
  for (const e of S.E) {
    if (!e.k) continue;
    let p = P.get(e.k);
    if (!p) P.set(e.k, p = { k: e.k, ac: 0, coz: 0, gun: 0, yar: 0, bir: 0, sn: 0, days: new Set(), mob: new Set(), os: '', yer: new Map(), saat: new Array(24).fill(0), son: '', bant: '', bantZ: '', seri: 0, site: new Set() });
    if (ACT.has(e.tur)) { p.days.add(e.gun); p.saat[e.saat]++; if (e.z > p.son) p.son = e.z; }
    if ('mobil' in e) p.mob.add(!!e.mobil);
    if (e.os) p.os = e.os;
    if (e.site) p.site.add(e.site);
    if (e.sh) { const y = e.il && e.il !== e.sh ? `${e.sh}, ${e.il}` : e.sh; p.yer.set(y, (p.yer.get(y) || 0) + 1); }
    if (e.tur === 'acilis') { p.ac++; if (e.bant && e.z >= p.bantZ) { p.bant = e.bant; p.bantZ = e.z; } if (e.seri > p.seri) p.seri = e.seri; }
    if (e.tur === 'bitti' && e.mod !== 'tutorial') { p.coz++; if (e.mod === 'daily') { p.gun++; if (e.seri > p.seri) p.seri = e.seri; } }
    if (e.tur === 'bitti' && e.simdiki && e.z >= p.bantZ) { p.bant = e.simdiki; p.bantZ = e.z; }
    if (e.tur === 'yardim') p.yar++;
    if (e.tur === 'birakti') p.bir++;
    if (e.tur === 'oturum') p.sn += e.sn || 0;
  }
  return [...P.values()].filter(p => p.days.size).sort((a, b) => b.sn - a.sn || b.coz - a.coz || b.ac - a.ac);
}

// yeni gelenler: ilk günü dönemde olan cihazlar
function yeniGelenler(A, B) {
  const today = fDay.format(new Date()), all = M.E.filter(e => e.k && !(state.testGizle && M.test.has(e.k)));
  const days = new Map(), coz = new Map(), tut = new Set();
  for (const e of all) {
    if (ACT.has(e.tur)) { if (!days.has(e.k)) days.set(e.k, new Set()); days.get(e.k).add(e.gun); }
    if (e.tur === 'bitti' && e.mod !== 'tutorial') coz.set(e.k, (coz.get(e.k) || 0) + 1);
    if (e.tur === 'bitti' && e.mod === 'tutorial' && e.son) tut.add(e.k);
  }
  const yeni = [...M.first.entries()].filter(([k, d]) => d >= A && d <= B && days.has(k) && !(state.testGizle && M.test.has(k)));
  let d1 = 0, d1n = 0, d7 = 0, d7n = 0, t = 0, r1 = 0, r5 = 0, r20 = 0;
  for (const [k, f] of yeni) {
    const D = days.get(k);
    if (dayAdd(f, 1) <= today) { d1n++; if (D.has(dayAdd(f, 1))) d1++; }
    if (dayAdd(f, 7) <= today) { d7n++; for (let i = 1; i <= 7; i++) if (D.has(dayAdd(f, i))) { d7++; break; } }
    if (tut.has(k)) t++;
    const n = coz.get(k) || 0; if (n >= 1) r1++; if (n >= 5) r5++; if (n >= 20) r20++;
  }
  return { n: yeni.length, d1, d1n, d7, d7n, t, r1, r5, r20 };
}

// ---------- grafik parçaları ----------
const tip = document.getElementById('tip');
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = 'block';
  const r = tip.getBoundingClientRect(), x = Math.min(ev.clientX + 14, innerWidth - r.width - 8), y = ev.clientY + 14 + r.height > innerHeight ? ev.clientY - r.height - 10 : ev.clientY + 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.display = 'none'; document.querySelectorAll('.cc-col.on').forEach(c => c.classList.remove('on')); }
document.addEventListener('scroll', hideTip, { passive: true });
function bindTips(root, tips) {
  root.querySelectorAll('[data-i]').forEach(el => {

}
function nice(max) {

}

  return { tips: items.map(it => it.tip), build: w => {
    if (labelW && w) every = Math.max(every, Math.ceil(items.length / Math.max(2, Math.floor((w - 34) / labelW))));
    const max = Math.max(0, ...items.map(it => it.v.reduce((a, b) => a + b, 0)));
    const { top, step } = nice(max);
    let y = '', gl = '';
    for (let t = 0; t <= top + 1e-9; t += step) { const b = (t / top) * 100; y += `<span style="bottom:${b}%">${num(t)}</span>`; if (t > 0) gl += `<div class="gl" style="bottom:${b}%"></div>`; }
    const cols = items.map((it, i) => {
      const segs = it.v.map((v, s) => v > 0 ? `<i style="height:${Math.max(2, v / top * h - 2)}px;background:${series[s].renk}"></i>` : '').reverse().join('');
      return `<div class="cc-col" data-i="${i}">${segs}</div>`;
    }).join('');
    const xs = items.map((it, i) => `<span>${i % every === 0 ? esc(it.x) : ''}</span>`).join('');
    const leg = series.length > 1 ? `<div class="legend">${series.map(s => `<span><b style="background:${s.renk}"></b>${esc(s.ad)}</span>`).join('')}</div>` : '';
    return `${leg}<div class="cc"><div class="cc-y" style="height:${h}px">${y}</div><div class="cc-plot" style="height:${h}px">${gl}<div class="cc-cols">${cols}</div></div><div class="cc-x">${xs}</div></div>`;

}

}

      ${table([['Olay'], ['Sayı', 'n']], [
        ['Bir üst seviyeye geçti', num(yuk.length)],
        ...[...count(kad, e => e.kademe).entries()].map(([k, v]) => [`Kademe atladı: ${esc(k.split('>').map(x => KADEME[x] || x).join(' → '))}`, num(v)]),
        ['"Daha kolay olsun mu?" teklifi: kabul / ret', `${num(tek.filter(e => e.kabul).length)} / ${num(tek.filter(e => !e.kabul).length)}`],
        ['Kademede kalmayı seçti', num(kal.length)],
      ])}</div>
  </section>

  <section class="grid g2">
    <div class="card"><h2>Günlük bulmaca</h2><p class="sub">${num(gb.length)} çözüm · ${num(new Set(gb.map(e => e.k)).size)} cihaz · ortanca süre ${gbSn == null ? '–' : sure(gbSn)} · en uzun seri ${gbSeri} gün</p>
      ${gb.length ? hbars([3, 2, 1].map(y => ({ l: '★'.repeat(y) + '☆'.repeat(3 - y), v: gb.filter(e => e.yildiz === y).length }))) : '<p class="empty">Bu dönemde günlük bulmaca çözülmedi.</p>'}</div>
    <div class="card"><h2>Yeni gelenler</h2><p class="sub">İlk kez bu dönemde gelen ${num(Y.n)} cihaz</p>
      ${table([['Adım'], ['Cihaz', 'n'], ['Oran', 'n']], [
        ['Öğreticiyi bitirdi', num(Y.t), pct(Y.t, Y.n)],
        ['İlk bulmacasını çözdü', num(Y.r1), pct(Y.r1, Y.n)],
        ['5+ bulmaca çözdü', num(Y.r5), pct(Y.r5, Y.n)],
        ['20+ bulmaca çözdü', num(Y.r20), pct(Y.r20, Y.n)],
        ['Ertesi gün geri geldi', num(Y.d1), pct(Y.d1, Y.d1n) + (Y.d1n < Y.n ? ` <span class="muted">(${Y.d1n} cihazın ertesi günü geldi)</span>` : '')],
        ['7 gün içinde geri geldi', num(Y.d7), pct(Y.d7, Y.d7n) + (Y.d7n < Y.n ? ` <span class="muted">(${Y.d7n} cihazın 7 günü doldu)</span>` : '')],
      ])}</div>
  </section>

  <section class="grid g2">
    <div class="card"><h2>Cihaz ve ortam</h2><p class="sub">Cihaz başına son açılış</p>
      <div class="sub" style="margin:0 0 6px">Hangi adresten</div>${tbl2(siteM)}
      <div class="sub" style="margin:14px 0 6px">Nasıl açıldı</div>${tbl2(srcM)}
      <div class="sub" style="margin:14px 0 6px">İşletim sistemi</div>${tbl2(osM)}
      <div class="sub" style="margin:14px 0 6px">Tarayıcı</div>${tbl2(brM)}</div>
    <div class="card"><h2>Tercihler</h2><p class="sub">Cihaz başına son açılış</p>
      <div class="sub" style="margin:0 0 6px">Oyun dili</div>${tbl2(dilM)}
      <div class="sub" style="margin:14px 0 6px">Tema</div>${tbl2(temaM)}
      <div class="sub" style="margin:14px 0 6px">Zorluk seçimi</div>${tbl2(otoM)}</div>
  </section>

  <section class="grid g2">
    <div class="card"><h2>Yardım ve bırakma</h2><p class="sub">${num(S.yar.length)} yardım · ${num(S.bir.length)} yarıda kalan seviye</p>
      ${table([['Ölçüm'], ['Sayı', 'n']], [
        ...[...yarM.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => [esc(k), num(v)]),
        ['Başka seviyeye geçti (yarıda)', num(S.bir.filter(e => !e.kapatti).length)],
        ['Oyunu kapattı (seviye yarıdayken)', num(S.bir.filter(e => e.kapatti).length)],
        ['Bırakma anı (ortanca)', S.bir.length ? sure(med(S.bir.map(e => e.sn || 0))) : '–'],
        ['Hatalı dokunuş (çözülen bulmaca başına)', S.cozum.length ? (S.cozum.reduce((a, e) => a + (e.hata || 0), 0) / S.cozum.length).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) : '–'],
        ['İlerlemeyi sıfırladı', num(S.T('sifirla').length)],
      ])}</div>
    <div class="card"><h2>Ekranlar ve ayarlar</h2><p class="sub">Açılan ekranlar ve değiştirilen ayarlar</p>
      <div class="sub" style="margin:0 0 6px">Ekran açılışı</div>${tbl2(ekrM)}
      <div class="sub" style="margin:14px 0 6px">Ayar değişikliği</div>${tbl2(ayarM, 10)}</div>
  </section>

  <ul class="foot">
    <li>"Cihaz" bir tarayıcıdır: aynı kişi iki tarayıcıdan ya da hem GitHub Pages hem Oracle adresinden girerse iki cihaz sayılır.</li>
    <li>"Testleri gizle": yalnızca GitHub Pages ve Oracle dışındaki adreslerden açan cihazlar gizlenir (otomatik testler ve yerel denemeler zaten hiç kaydedilmez).</li>
    <li>Oyun süresi: oyun ekranda açıkken geçen süre (sekme arka plandayken sayılmaz).</li>
    <li>Konum IP'nin ağ kısmından tahmin edilir; tam IP saklanmaz. ${RAW.konum ? '' : '<b>Konum veritabanı şu an yüklenemedi.</b> '}IP Geolocation by <a href="https://db-ip.com">DB-IP</a>.</li>
    <li>Oyun: <a href="${OYUN}">${OYUN}</a> · Oracle sunucusu: <a href="${SUNUCU}">${SUNUCU}</a> · Canlı rapor: <a href="${SUNUCU}/api/rapor">${SUNUCU}/api/rapor</a></li>
  </ul>`;

  const put = (id, c) => { const el = document.getElementById(id); if (el) { el.innerHTML = c.build(el.clientWidth); bindTips(el, c.tips); } };
  put('c-solve', cSolve); put('c-dev', cDev); put('c-hour', cHour); put('c-wd', cWd);
  document.querySelectorAll('[data-donem]').forEach(b => b.onclick = () => { state.donem = b.dataset.donem; state.hepsi = false; store.set('vals.donem', state.donem); render(); });
  document.querySelectorAll('[data-metrik]').forEach(b => b.onclick = () => { state.metrik = b.dataset.metrik; render(); });
  document.getElementById('tg').onchange = ev => { state.testGizle = ev.target.checked; store.set('vals.test', state.testGizle ? '1' : '0'); render(); };
  document.getElementById('yenile').onclick = load;
  document.getElementById('pdf').onclick = () => window.print();
  if (printing) document.querySelectorAll('details').forEach(d => d.open = true);
  const hb = document.getElementById('hepsi'); if (hb) hb.onclick = () => { state.hepsi = !state.hepsi; render(); };
}
// yazdırırken tüm oyuncular ve tablolar açık olsun
let printing = false, hepsiOnce = false;
addEventListener('beforeprint', () => { if (!RAW || printing) return; printing = true; hepsiOnce = state.hepsi; state.hepsi = true; render(); });
addEventListener('afterprint', () => { if (!printing) return; printing = false; state.hepsi = hepsiOnce; render(); });
let lastW = innerWidth;
addEventListener('resize', () => { if (RAW && Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; render(); } });
load();
</script>
</body>
</html>
